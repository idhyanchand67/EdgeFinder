name: Refresh props and publish

on:
  schedule:
    - cron: "15 13,23 * * *"  # ~9am and 7pm ET - see README's Odds API credits section before widening this
  workflow_dispatch: {}       # lets you trigger a run manually from the Actions tab

permissions:
  contents: write   # needed to commit data/pick_log.csv back to the repo
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore stats cache
        uses: actions/cache@v4
        with:
          path: data/*_stats.csv
          key: stats-cache-${{ github.run_id }}
          restore-keys: |
            stats-cache-

      - run: pip install -r requirements.txt

      - name: Build report
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python main.py

      - name: Commit updated pick log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/pick_log.csv
          if git diff --staged --quiet; then
            echo "No pick log changes"
          else
            git commit -m "Update pick log [automated]"
            git pull --rebase origin main
            git push
          fi

      - name: Package for Pages
        run: |
          mkdir -p site
          cp report.html site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
